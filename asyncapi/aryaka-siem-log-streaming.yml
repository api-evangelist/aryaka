surface: log-streaming
note: >-
  Aryaka publishes NO AsyncAPI document and NO webhook catalog. This file records the one
  machine-consumable outbound event surface Aryaka does document: SIEM log streaming from
  the Aryaka service to a customer-operated SIEM, configured inside MyAryaka. Aryaka
  publishes a per-log-type attribute reference for each stream, which is the closest thing
  it ships to a message schema. Because this is log forwarding rather than an HTTP webhook
  or a published AsyncAPI channel set, NO `AsyncAPI` and NO `Webhooks` pointer is emitted
  in apis.yml — recording one would overstate Aryaka's event posture.
configuration:
  location: MyAryaka portal
  docs: https://docs.aryaka.com/space/KNOW/289505287/Configure+SIEM+integration
