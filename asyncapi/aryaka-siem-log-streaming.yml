  description: SD-WAN flow records forwarded to the customer SIEM.
  attributes_reference: https://docs.aryaka.com/space/KNOW/736362516/Flow+log+attributes+for+SIEM+integration
- name: Private Access logs
  description: Universal ZTNA / Private Access session events forwarded to the customer SIEM.
