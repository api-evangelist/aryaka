aid: aryaka
name: Aryaka
description: >-
  Aryaka Networks, Inc. is a San Mateo, California company that delivers Unified SASE
  as a Service — a converged, fully managed networking and security platform sold as a
  single service rather than as stitched-together appliances. The platform combines
  Aryaka's own private global Layer-2/Layer-3 core network and PoP footprint (Global
  Connectivity), a fully managed SD-WAN that replaces MPLS, WAN and application
  acceleration (TCP optimization, deduplication, compression, SMB and SSL acceleration),
  multi-cloud on-ramps to AWS, Azure, Google Cloud, Oracle and Alibaba, and a complete
  single-pass security stack — next-generation firewall, secure web gateway, CASB,
  DNS filtering, URL and domain reputation, anti-malware, IPS, tenant restriction and
  Universal ZTNA / secure remote access. Newer AI-oriented services, AI>Perform and
  AI>Secure, accelerate and inspect GenAI and LLM traffic. Customers operate the service
  through MyAryaka, a multi-tenant orchestration, monitoring and business-management
  portal (dashboards, site and policy configuration, alerting, log explorer, SLA and
  billing reports, order and contract management), with a companion MyAryaka Partner
  Portal for MSPs and telcos in the "Powered by Aryaka" program. Aryaka publishes a
  large public documentation portal at docs.aryaka.com and an llms.txt at the root of
  aryaka.com, and documents SIEM log-streaming integration with published log-attribute
  schemas, but as of this profiling round it publishes no public developer portal,
  no machine-readable API contract (OpenAPI/AsyncAPI/GraphQL), no client SDKs and no
  MCP or A2A agent surface — programmatic access is gated behind the MyAryaka portal.
